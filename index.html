<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <title>주문 호출기</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #111;
      color: white;
      margin: 0;
    }

    #display {
      font-size: 60px;
      margin: 20px 0;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 12px;
      max-width: 500px;
      margin: 0 auto;
    }

    button {
      font-size: 32px;
      padding: 22px;
      border-radius: 16px;
      border: none;
      background: #333;
      color: white;
    }

    button:active {
      background: #555;
    }

    .call {
      background: #007aff;
    }

    .clear {
      background: #ff3b30;
    }

    .cancel {
      margin-top: 15px;
      background: #888;
    }

    .languages {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  max-width: 500px;
  margin: 12px auto 0;
  padding: 0 12px;
}

.languages button {
  font-size: 18px;
  padding: 12px 6px;
  border-radius: 12px;
}
    
    #recent {
      font-size: 18px;
      opacity: 0.7;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div id="display">0</div>

  <div class="keypad">
    <button onclick="add(1)">1</button>
    <button onclick="add(2)">2</button>
    <button onclick="add(3)">3</button>

    <button onclick="add(4)">4</button>
    <button onclick="add(5)">5</button>
    <button onclick="add(6)">6</button>

    <button onclick="add(7)">7</button>
    <button onclick="add(8)">8</button>
    <button onclick="add(9)">9</button>

    <button class="clear" onclick="clearDisplay()">C</button>
    <button onclick="add(0)">0</button>
    <button class="call" onclick="callNumber()">호출</button>
  </div>

  <p id="recent">
    최근 호출: 없음
  </p>

  <button class="cancel" onclick="cancelCall()">
    호출 취소
  </button>

  <div class="languages">
  <button onclick="setLanguage('ko')">한국어</button>
  <button onclick="setLanguage('en')">English</button>
  <button onclick="setLanguage('ja')">日本語</button>
  <button onclick="setLanguage('zh')">中文</button>
  </div>

  <script>
    let number = "";

    let language = "ko";

function setLanguage(lang) {
  language = lang;
}
    function add(n) {
      number += n;
      document.getElementById("display").innerText = number;
    }

    function clearDisplay() {
      number = "";
      document.getElementById("display").innerText = "0";
    }

    function callNumber() {
      if (!number) return;

      const currentNumber = number;

      let message = "";
let voiceLanguage = "";

if (language === "ko") {
  message = `${currentNumber}번 고객님, 주문하신 메뉴가 준비되었습니다.`;
  voiceLanguage = "ko-KR";
}

if (language === "en") {
  message = `Customer number ${currentNumber}, your order is ready.`;
  voiceLanguage = "en-US";
}

if (language === "ja") {
  message = `${currentNumber}番のお客様、ご注文のメニューができあがりました。`;
  voiceLanguage = "ja-JP";
}

if (language === "zh") {
  message = `${currentNumber}号顾客，您点的餐已经准备好了。`;
  voiceLanguage = "zh-CN";
}

const msg = new SpeechSynthesisUtterance(message);
msg.lang = voiceLanguage;

      speechSynthesis.cancel();
      speechSynthesis.speak(msg);

      document.getElementById("recent").innerText =
        "최근 호출: " + currentNumber + "번";

      number = "";
      document.getElementById("display").innerText = "0";
    }

    function cancelCall() {
      speechSynthesis.cancel();
    }
  </script>

</body>
</html>
